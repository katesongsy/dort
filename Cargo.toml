[workspace]
members = ["crates/dort-core", "crates/dort"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
rustix = { version = "1.1", features = ["fs", "process"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"
thiserror = "2.0"
toml = "1.0"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
assert_cmd = "2.0"
