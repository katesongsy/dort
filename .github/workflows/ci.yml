name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt
          rustup default 1.99.1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Runtime platform evidence
        run: |
          uname -sm
          rustc -Vv
          git --version
          python3 --version
      - name: Required filesystem fixture prerequisites
        run: |
          python3 - <<'PY'
          import os, sys, tempfile
          assert os.geteuid() != 0, "Permission tests require a non-root runner"
          if sys.platform == "linux":
              with tempfile.TemporaryDirectory() as ordinary, tempfile.TemporaryDirectory(dir="/dev/shm") as other:
                  assert os.stat(ordinary).st_dev != os.stat(other).st_dev, "Cross-device tests require distinct filesystems"
          PY
      - run: cargo test --workspace --locked -- --test-threads=1 --nocapture
      - run: cargo build --workspace --locked
      - name: Public documentation gate
        run: |
          python3 scripts/check-docs.py --self-test
          python3 scripts/check-docs.py
      - name: Mount-free cross-device launcher guard checks
        run: python3 scripts/test-cross-device-macos.py --self-test
      - name: Disposable terminal lifecycle gate
        run: python3 scripts/test-terminal.py
      - name: Cargo source package guards
        run: |
          python3 scripts/check-crates.py --self-test
          python3 scripts/check-crates.py
          cargo package --workspace --locked
          python3 scripts/check-crates.py --archives
      - name: Release packaging guard tests
        run: python3 scripts/release.py --self-test
      - name: Package stable-version native binary
        id: package
        env:
          MACOSX_DEPLOYMENT_TARGET: "15.0"
          TARGET: ${{ matrix.target }}
        run: |
          tag="v$(python3 -c 'import runpy; print(runpy.run_path("scripts/release.py")["version"]())')"
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            python3 scripts/release.py --package --tag "$tag" --target "$TARGET"
            echo 'packaged=true' >> "$GITHUB_OUTPUT"
          else
            echo 'SKIP release archive: workspace version is not a stable release'
          fi
      - name: Retain native release archive
        if: steps.package.outputs.packaged == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
      - run: git diff --exit-code
      - run: git diff --check
