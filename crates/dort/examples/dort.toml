schema = 1
[profiles]
available = ["dev", "macos", "linux"]
default = ["base"]
[profiles.platform]
macos = ["macos"]
linux = ["linux"]
[[tools]]
id = "git"
binary = "git"
[tools.install]
provider = "brew"
package = "git"
[[tools]]
id = "node"
binary = "node"
profiles = ["dev"]
[tools.install]
provider = "brew"
package = "node"
[[tools]]
id = "pi"
binary = "pi"
profiles = ["dev"]
requires = ["node"]
[tools.install]
provider = "npm"
package = "@mariozechner/pi-coding-agent"
runtime_tool = "node"
[[files]]
id = "zshrc"
source = "files/common/zshrc"
target = "~/.zshrc"
mode = "link"
[[files]]
id = "gitconfig"
source = "templates/gitconfig.j2"
target = "~/.gitconfig"
mode = "template"
permissions = "0644"
[[files]]
id = "example-secret"
source = "secrets/example.age"
target = "~/.config/example/credentials"
mode = "secret"
permissions = "0600"
profiles = ["dev"]
